{% extends 'base.html' %}

{% block head %}
    <title>Create Level</title>
    <link href="{{ url_for('static', filename='create.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='create.js') }}" defer></script>
{% endblock %}

{% block content %}
<div id="flex">

    <!-- LEFT SIDE: Level info and tile controls -->
    <div id="infoSide">

        <h2>Level Settings</h2>
        <form method="POST" class="form" id="levelForm">
            <label for="levelName">Level Name:</label>
            <input type="text" name="levelName" id="levelName" required>
            <br><br>

            <label for="levelWidth">Level Width:</label>
            <input type="number" id="levelWidth" name="levelWidth" value="10" min="1">
            <br><br>

            <label for="levelHeight">Level Height:</label>
            <input type="number" id="levelHeight" name="levelHeight" value="10" min="1">
            <br><br>

            <label>Tile Type:</label>
            <div id="tileTypeRadios">
                <input type="radio" name="tileType" value="Empty" id="tileEmpty" checked>
                <label for="tileEmpty">Erase / Empty</label><br>

                <input type="radio" name="tileType" value="Player" id="tilePlayer">
                <label for="tilePlayer" class="player">Player</label><br>

                <input type="radio" name="tileType" value="Wall" id="tileWall">
                <label for="tileWall" class="blank">Wall</label><br>

                <input type="radio" name="tileType" value="Box" id="tileBox">
                <label for="tileBox" class="box">Box</label><br>

                <input type="radio" name="tileType" value="PressurePlate" id="tilePressurePlate">
                <label for="tilePressurePlate" class="pressurePlate">Pressure Plate</label><br>

                <input type="radio" name="tileType" value="Cannon" id="tileCannon">
                <label for="tileCannon" class="cannon">Cannon</label><br>

                <input type="radio" name="tileType" value="Fuse" id="tileFuse">
                <label for="tileFuse" class="fuse">Fuse</label><br>
                
                <input type="radio" name="tileType" value="Exit" id="tileExit">
                <label for="tileExit" class="exit">Exit</label><br>

            </div>
            <br>

            <label for="levelNote">Level Notes:</label>
            <textarea id="levelNote" name="levelNote"></textarea>
            <br><br>

            <input type="hidden" name="data" id="data"> <!-- Will store serialized board state -->
            <button type="submit">Create Level</button>
        </form>

        <h3>Tiles</h3>
        

    </div>
    <div id="tileDropdowns">
        {% for tile in ["Player","Wall","Box","PressurePlate","Cannon","Fuse", "Exit"] %}
        <details>
            <summary>{{ tile }} Tiles</summary>
            <div class="tileList" id="list_{{ tile }}">
                <button class="addTile" data-type="{{ tile }}">+ Add {{ tile }}</button>
            </div>
        </details>
        {% endfor %}
    </div>
    <!-- RIGHT SIDE: Interactive grid -->
    <div id="tableSide">
        <table id="createTable"></table>
    </div>

</div>
{% endblock %}
