{# The speaker button and its volume panel (soundmenu.js runs it). Shared with the standalone build. #}
{% macro sound_menu(test_link=None) %}
<div class="sound-menu">
    <button class="navlink sound-toggle" id="soundToggle" type="button" aria-expanded="false" aria-controls="soundPanel" title="Sound (M to mute)">
        <span class="speaker" aria-hidden="true"></span><span class="sr-only">Sound settings</span>
    </button>
    <div class="sound-panel panel hidden" id="soundPanel">
        <label for="musicVol">Music</label>
        <input type="range" id="musicVol" min="0" max="1" step="0.05">
        <label for="sfxVol">Effects</label>
        <input type="range" id="sfxVol" min="0" max="1" step="0.05">
        <label class="check"><input type="checkbox" id="muteAll"> Mute everything <kbd>M</kbd></label>
        <label class="check" title="Off: the shorter chapter loops instead of the long tracks that build up room by room"><input type="checkbox" id="longMusic"> Long chapter music</label>
        {% if test_link %}<a href="{{ test_link }}">Sound test</a>{% endif %}
    </div>
</div>
{% endmacro %}
