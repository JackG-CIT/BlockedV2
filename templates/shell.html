<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blocked</title>
    <link rel="icon" href="{{ asset('img/chest.svg') }}">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1d3b53; }
        iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
    <!-- The music lives on this page, which never reloads. Every real page of the
         site loads in the frame below, so songs keep playing between pages and
         crossfade when a page asks for a different one. -->
    <script>window.BLOCKED_SHELL = true; window.BLOCKED_AUDIO = {{ {'files': music_files}|tojson }};</script>
    <script src="{{ asset('js/audio.js') }}"></script>
</head>
<body>
    <iframe id="page" src="{{ src }}" title="Blocked"></iframe>
    <script>
        // Keep the address bar and tab title in step with the page in the frame.
        const frame = document.getElementById("page");
        frame.addEventListener("load", () => {
            try {
                const w = frame.contentWindow;
                document.title = w.document.title;
                const url = w.location.pathname + w.location.search + w.location.hash;
                if (url !== location.pathname + location.search + location.hash) history.replaceState(null, "", url);
                w.focus();
            } catch (e) { /* a page from another site: leave the address bar alone */ }
        });
    </script>
</body>
</html>
